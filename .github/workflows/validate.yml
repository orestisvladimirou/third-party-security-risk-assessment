name: Validate simulated supplier assessment

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate inventory, scores and references
        run: python scripts/validate_project.py
      - name: Validate Phase 2 data
        run: python scripts/validate_phase2.py
      - name: Validate Phase 3 monitoring
        run: python scripts/validate_phase3.py
      - name: Enforce strict workbook and document integrity
        run: python scripts/audit_publication.py --strict
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
