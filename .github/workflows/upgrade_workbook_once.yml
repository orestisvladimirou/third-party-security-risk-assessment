name: Upgrade reviewed workbook (one-time)

on:
  push:
    paths:
      - ".github/workflows/upgrade_workbook_once.yml"

permissions:
  contents: write

jobs:
  replace-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current private repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Rebuild baseline correction and cross-phase worksheets
        run: python scripts/upgrade_workbook.py
      - name: Require strict pre-publication integrity checks
        run: python scripts/audit_publication.py --strict
      - name: Commit reviewed workbook to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Third_Party_Risk_Assessment.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Replace obsolete workbook with reviewed cross-phase v1.3"
            git push origin HEAD:main
          fi
